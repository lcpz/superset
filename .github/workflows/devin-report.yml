name: Devin status board

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      board_issue:
        description: "Issue number hosting the status board comment (created if empty)"
        required: false
        default: ""

permissions: {}

concurrency:
  group: devin-status-board
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
      pull-requests: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Generate report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
          DEVIN_ORG_ID: ${{ secrets.DEVIN_ORG_ID }}
          DEVIN_AUTOMATION_ID: ${{ vars.DEVIN_AUTOMATION_ID }}
        run: |
          python scripts/devin_report.py --output report.md --json rows.json
          echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: devin-status-board
          path: |
            report.md
            rows.json

      - name: Upsert status board comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOARD_ISSUE: ${{ inputs.board_issue || vars.DEVIN_BOARD_ISSUE }}
        run: |
          set -euo pipefail
          if [ -z "$BOARD_ISSUE" ]; then
            BOARD_ISSUE=$(gh issue list --repo "$GITHUB_REPOSITORY" --label devin:status-board --state open --json number --jq '.[0].number // empty')
          fi
          if [ -z "$BOARD_ISSUE" ]; then
            gh label create devin:status-board --repo "$GITHUB_REPOSITORY" --color 1d76db --description "Hosts the Devin status board" --force
            BOARD_ISSUE=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "Devin status board" --label devin:status-board \
              --body "Automated report, refreshed by the devin-report workflow. See docs/devin-observability.md." | grep -oE '[0-9]+$')
          fi
          COMMENT_ID=$(gh api "repos/$GITHUB_REPOSITORY/issues/$BOARD_ISSUE/comments?per_page=100" \
            --jq '[.[] | select(.body | startswith("<!-- devin-status-board -->"))][0].id // empty')
          if [ -n "$COMMENT_ID" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" -F body=@report.md >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$BOARD_ISSUE/comments" -F body=@report.md >/dev/null
          fi
          echo "Board: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/issues/$BOARD_ISSUE"
